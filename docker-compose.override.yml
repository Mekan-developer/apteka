# Dev: подхватывается автоматически при `docker compose up`.
# Код монтируется с хоста, изменения видны сразу.

services:
  php:
    build:
      target: dev
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    volumes:
      - ./:/var/www/app

  queue:
    build:
      target: dev
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    volumes:
      - ./:/var/www/app

  nginx:
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./:/var/www/app:ro

  postgres:
    ports:
      - "127.0.0.1:5433:5432"
    # Создаёт тестовую базу при первом запуске (пустой volume)
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
